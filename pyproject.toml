[project]
name = "jjargon"
version = "0.1.0"
description = "Japanese jargon & technical term extraction tool using Sudachi and LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sudachipy>=0.6.8",
    "sudachidict-core>=20240409",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "openai>=1.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
jjargon = "jjargon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "ty>=0.0.88",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
